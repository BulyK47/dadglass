<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- DadGlass app icon — vector master.
       Rendered to every Android density + all PWA sizes by scripts/gen-icons.mjs.
       Full-bleed square, no transparency, no rounded corners (the OS applies its
       own mask), subject centred inside the adaptive-icon safe zone. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%"   stop-color="#1b2942"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </radialGradient>
    <linearGradient id="juice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#f6a723"/>
      <stop offset="100%" stop-color="#ef8c06"/>
    </linearGradient>
    <!-- glass body silhouette, used to clip the liquid -->
    <clipPath id="bodyClip">
      <path d="M292 300 L347 748 Q347 780 379 780 L645 780 Q677 780 677 748 L732 300 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- liquid, clipped to the glass -->
  <g clip-path="url(#bodyClip)">
    <rect x="280" y="418" width="464" height="380" fill="url(#juice)"/>
    <!-- surface ellipse: just a hint darker, so the top reads as a liquid surface -->
    <ellipse cx="512" cy="422" rx="207" ry="30" fill="#e59313" opacity="0.45"/>
  </g>

  <!-- highlight stripe inside the liquid -->
  <rect x="386" y="470" width="34" height="250" rx="17" fill="#fdf3e0" opacity="0.92"/>

  <!-- glass body outline -->
  <path d="M292 300 L347 748 Q347 780 379 780 L645 780 Q677 780 677 748 L732 300"
        fill="none" stroke="#ffffff" stroke-width="27" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- rim opening -->
  <ellipse cx="512" cy="300" rx="220" ry="38"
           fill="none" stroke="#ffffff" stroke-width="27"/>
</svg>
