# Builds the app and publishes it to GitHub Pages.
#
# What this gives you:
#   • a public HTTPS URL for the PRIVACY POLICY (both app stores require one)
#   • the installable PWA that iPhone users can "Add to Home Screen" for free
#
# Hosting path:
# This deploys to a GitHub Pages *project* page — https://<user>.github.io/dadglass/ —
# so the app is built with `npm run build:pages` (base "/dadglass/"). Every runtime
# URL goes through src/app/utils/assetUrl.ts and the manifest uses relative URLs,
# so the same source also builds at the root for the native Capacitor apps
# (plain `npm run build`, base "/").
#
# If you ever move to a custom domain or a <user>.github.io repo, set
#   APP_BASE: "/"
# in the build step below.
#
# Setup once: repo → Settings → Pages → Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The public repo ships placeholder content; fill in the sample images so
      # the deployed demo has something to render.
      - run: npm run sample:assets

      - run: npm run build:pages
        env:
          APP_BASE: /dadglass/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
